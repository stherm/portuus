<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Temporarily unavailable - portuus</title>
    <style>
@colors@
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at top, var(--portuus-surface-hover) 0%, var(--portuus-navy) 60%) no-repeat,
          var(--portuus-navy);
        color: var(--portuus-text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      main {
        max-width: 32rem;
        padding: 2rem 1.5rem;
      }
      svg {
        width: 140px;
        height: 140px;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 2rem;
      }
      p {
        margin: 0;
        color: var(--portuus-muted);
      }
      a {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.65rem 1.4rem;
        border-radius: 999px;
        background: var(--portuus-blue-600);
        color: var(--portuus-text);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: var(--portuus-blue-500);
      }
    </style>
  </head>
  <body>
    <main>
      @logo@
      <h1>Be right back</h1>
      <p>This service is not reachable at the moment. It is probably restarting or being updated. Please try again in a few minutes.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
