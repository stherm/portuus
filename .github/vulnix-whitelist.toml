until = "2027-01-18"
comment = "CVE-2026-35191 not applicable: Only affects an OpenSSL-native QUIC server without address validation. No user of openssl-3.5.8 (only the Immich stack) runs a QUIC server: Immich only listens via HTTP behind nginx, and curl/Node use ngtcp2 for QUIC instead of the OpenSSL QUIC stack. | CVE-2026-42772 not applicable: Bug in the QUIC stream reassembly of the OpenSSL-native QUIC stack. The consumers of openssl-3.5.8 (Immich Node/Python, curl, ffmpeg libs) do not use this stack; HTTP/3 in curl and Node runs via ngtcp2, Python ssl has no QUIC. | CVE-2026-54872 not applicable: Timing leak only for ECDSA/SM2 signatures on generic curves (e.g. Brainpool); NIST curves are not affected. In the Immich stack, the only user of openssl-3.5.8, there are no signing operations with its own private keys (no TLS server, no client certificates). | CVE-2026-54873 not applicable: Only affects buffer management of the OpenSSL-native QUIC stack, which is not used by any consumer of openssl-3.5.8 (curl/Node use ngtcp2, Immich has no QUIC endpoint). | CVE-2026-54875 not applicable: According to the advisory only affected on AArch64 and RISC-V and only for SM2 operations; portuus is x86_64-linux and does not use SM2. | CVE-2026-72897 not applicable: Only affects TLS servers that call SSL_set_SSL_CTX() mid-handshake and have contexts with differing numbers of provider sigalgs (not the default). No TLS server on portuus uses openssl-3.5.8: Immich only speaks HTTP behind nginx, and nginx links openssl-4.0.3. | CVE-2026-75804 not applicable: Missing connection flow control in the OpenSSL-native QUIC stack; it is not used by any user of openssl-3.5.8 (QUIC in curl/Node via ngtcp2). | CVE-2026-75805 not applicable: Only affects CMP clients that request certificate revocation via a PKCS#10 CSR (openssl cmp -cmd rr -csr or OSSL_CMP_exec_RR_ses). CMP is not used anywhere on the hosts. | CVE-2026-75806 not applicable: Only existing DTLS 1.2 associations are affected (for TLS only protocol conformance). No consumer of openssl-3.5.8 on portuus uses DTLS: Immich Node/Python speak TLS over TCP, ffmpeg only processes local files, pipewire is not running (services.pipewire.enable = false). | CVE-2026-77696 not applicable: Only affects SM2 signature generation. On portuus no user of openssl-3.5.8 generates SM2 signatures; there are neither SM2 keys nor a TLS server in the Immich stack. | CVE-2026-84782 not applicable: Bug in the DTLS retransmission logic; only DTLS connections are affected. No consumer of openssl-3.5.8 (Immich server, Immich ML, ffmpeg libs) establishes DTLS connections, pipewire is not running. | CVE-2026-84784 not applicable: NEW_CONNECTION_ID flood in the OpenSSL-native QUIC stack; it is not used by any user of openssl-3.5.8 (curl/Node use ngtcp2, Python ssl has no QUIC)."

