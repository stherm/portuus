["openssh-10.5p1"]
cve = [
  "CVE-2026-106552",
  "CVE-2026-106553",
  "CVE-2026-106555",
  "CVE-2026-106582",
  "CVE-2026-106583",
  "CVE-2026-106584",
  "CVE-2026-106585",
  "CVE-2026-106586",
  "CVE-2026-106587",
]
until = "2027-01-18"
comment = "CVE-2026-106552 not applicable: Only affects the sftp client during a recursive download from a malicious server. No service on edge or portuus uses sftp or scp as a client (edge-backup, the fail2ban action and deploy-rs only use ssh to our own hosts); only manual admin use against a third-party server would be affected. | CVE-2026-106553 not applicable: nixpkgs builds openssh with withKerberos=false, i.e. without --with-kerberos5, so GSSAPI authentication is not compiled in; sshd-auth links no libgssapi/krb5, and GSSAPIAuthentication is not set in sshd_config (default no). | CVE-2026-106555 not applicable: Like CVE-2026-106553: GSSAPI authentication does not exist in the nixpkgs build without Kerberos and is not configured on either host, so the affected state cannot arise. | CVE-2026-106582 not applicable: Affects zlib compression after login. Since ssh_hardening, Compression = no applies on portuus and edge, so the flaw is not reachable. Fixed in openssh 10.6p1. | CVE-2026-106583 not applicable: Only affects the ssh client when a username from an untrusted source ends up on the command line and is expanded in ProxyCommand/Match exec. All ssh invocations on the hosts use fixed usernames, and the only ProxyCommand (systemd-ssh-proxy) uses only %h/%p, no %r. | CVE-2026-106584 not applicable: Only affects issuing SSH certificates with ssh-keygen (wrong expiry time during daylight saving time). No SSH certificates are created or accepted on the hosts: no TrustedUserCAKeys, no HostCertificate, AuthorizedPrincipalsFile none, no ssh-keygen -s in the repo. | CVE-2026-106585 not applicable: Affects zlib compression after login. Since ssh_hardening, Compression = no applies on portuus and edge, so the flaw is not reachable. Fixed in openssh 10.6p1. | CVE-2026-106586 not applicable: The restrict bug only affects tunnel forwarding (PermitTunnel). PermitTunnel is not set on either host and is therefore globally no, so the restrict keys on edge (edge-backup, mail-ban) cannot open a tunnel. | CVE-2026-106587 not applicable: According to the release notes, \"none\" is only wrongly interpreted as a file name when the option is overridden in a Match block. The sshd_config of both hosts contains AuthorizedPrincipalsFile none only globally and no Match block."

["openssl-3.5.8"]
cve = [
  "CVE-2026-35191",
  "CVE-2026-42772",
  "CVE-2026-54872",
  "CVE-2026-54873",
  "CVE-2026-54875",
  "CVE-2026-72897",
  "CVE-2026-75804",
  "CVE-2026-75805",
  "CVE-2026-75806",
  "CVE-2026-77696",
  "CVE-2026-84782",
  "CVE-2026-84784",
]
until = "2027-01-18"
comment = "CVE-2026-35191 not applicable: Only affects an OpenSSL-native QUIC server without address validation. No user of openssl-3.5.8 (only the Immich stack) runs a QUIC server: Immich only listens via HTTP behind nginx, and curl/Node use ngtcp2 for QUIC instead of the OpenSSL QUIC stack. | CVE-2026-42772 not applicable: Bug in the QUIC stream reassembly of the OpenSSL-native QUIC stack. The consumers of openssl-3.5.8 (Immich Node/Python, curl, ffmpeg libs) do not use this stack; HTTP/3 in curl and Node runs via ngtcp2, Python ssl has no QUIC. | CVE-2026-54872 not applicable: Timing leak only for ECDSA/SM2 signatures on generic curves (e.g. Brainpool); NIST curves are not affected. In the Immich stack, the only user of openssl-3.5.8, there are no signing operations with its own private keys (no TLS server, no client certificates). | CVE-2026-54873 not applicable: Only affects buffer management of the OpenSSL-native QUIC stack, which is not used by any consumer of openssl-3.5.8 (curl/Node use ngtcp2, Immich has no QUIC endpoint). | CVE-2026-54875 not applicable: According to the advisory only affected on AArch64 and RISC-V and only for SM2 operations; portuus is x86_64-linux and does not use SM2. | CVE-2026-72897 not applicable: Only affects TLS servers that call SSL_set_SSL_CTX() mid-handshake and have contexts with differing numbers of provider sigalgs (not the default). No TLS server on portuus uses openssl-3.5.8: Immich only speaks HTTP behind nginx, and nginx links openssl-4.0.3. | CVE-2026-75804 not applicable: Missing connection flow control in the OpenSSL-native QUIC stack; it is not used by any user of openssl-3.5.8 (QUIC in curl/Node via ngtcp2). | CVE-2026-75805 not applicable: Only affects CMP clients that request certificate revocation via a PKCS#10 CSR (openssl cmp -cmd rr -csr or OSSL_CMP_exec_RR_ses). CMP is not used anywhere on the hosts. | CVE-2026-75806 not applicable: Only existing DTLS 1.2 associations are affected (for TLS only protocol conformance). No consumer of openssl-3.5.8 on portuus uses DTLS: Immich Node/Python speak TLS over TCP, ffmpeg only processes local files, pipewire is not running (services.pipewire.enable = false). | CVE-2026-77696 not applicable: Only affects SM2 signature generation. On portuus no user of openssl-3.5.8 generates SM2 signatures; there are neither SM2 keys nor a TLS server in the Immich stack. | CVE-2026-84782 not applicable: Bug in the DTLS retransmission logic; only DTLS connections are affected. No consumer of openssl-3.5.8 (Immich server, Immich ML, ffmpeg libs) establishes DTLS connections, pipewire is not running. | CVE-2026-84784 not applicable: NEW_CONNECTION_ID flood in the OpenSSL-native QUIC stack; it is not used by any user of openssl-3.5.8 (curl/Node use ngtcp2, Python ssl has no QUIC)."

["patch-2.8"]
cve = [
  "CVE-2026-56288",
  "CVE-2026-56289",
]
until = "2027-01-18"
comment = "CVE-2026-56288 not applicable: A NULL pointer DoS in GNU patch with a malicious patch file. patch is only on the PATH as a CLI and runs in Nix builds (stdenv), whose patches come from nixpkgs or our own repo. No service applies external patch files with GNU patch. | CVE-2026-56289 not applicable: A CPU DoS (infinite loop) in GNU patch with a malicious patch file. No service processes external patch files with GNU patch, usage is limited to the admin CLI and Nix builds with trusted patches."

["pgvector-0.8.2"]
cve = [
  "CVE-2026-18022",
]
until = "2027-01-18"
comment = "CVE-2026-18022 not applicable: According to the advisory only 32-bit systems are affected. portuus is x86_64. In addition, the flaw could only be exploited by a database user when building an IVFFlat index."

["sqlite-3.51.2"]
cve = [
  "CVE-2026-11822",
  "CVE-2026-11824",
]
until = "2027-01-18"
comment = "CVE-2026-11822 not applicable: The FTS5 flaws are genuinely present: FTS5 is enabled, fixed only in 3.53.2, and there is no patch. Exploitation requires opening a crafted database file with corrupted FTS5 pages and running an FTS5 MATCH on it. No service on the hosts opens users' SQLite files or allows arbitrary SQL. | CVE-2026-11824 not applicable: The heap overflow in fts5ChunkIterate only occurs with a crafted database file (szLeaf < 4) and an FTS5 MATCH query. No service on edge or portuus opens SQLite databases from attackers. All databases belong to the services themselves."
