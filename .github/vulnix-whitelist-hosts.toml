]
until = "2027-01-18"
comment = "CVE-2026-6846 not applicable: The heap overflow is in xcoff_link_add_symbols (bfd/xcofflink.c) and only occurs when linking XCOFF objects. Our binutils is built without --enable-targets=all, only for x86_64-linux. objdump -i lists no XCOFF/aixcoff targets, and libbfd exports no xcoff link symbols."

["busybox-1.37.0"]
