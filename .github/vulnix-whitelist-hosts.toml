  "CVE-2026-105083",
]
until = "2027-01-18"
comment = "CVE-2026-102635 not applicable: 7.1.2-31 only comes in via vips in Immich (unstable) and is unpatched. However, vips reads GIFs with the built-in nsgif loader (priority 50) instead of magickload (-100); both detect GIF by the magic 'GIF8'. The vulnerable IM GIF coder is therefore never reached for GIF data. | CVE-2026-105083 not applicable: The bypass only applies when a policy.xml with an alternative DOCTYPE is used. There is no custom ImageMagick policy on the hosts. The bundled policy.xml uses the standard DOCTYPE with an internal subset ('<!"

["inetutils-2.7"]
cve = [
  "CVE-2026-32772",
]
until = "2027-01-18"
comment = "CVE-2026-32772 not applicable: Only the telnet client is affected, when connecting to a malicious server. inetutils is not in system-path. It only appears in the internal PATH of the home-manager script, which never calls telnet (it is there for hostname etc.). nixpkgs patches other inetutils CVEs, but not this one."

["libsndfile-1.2.2"]
cve = [
  "CVE-2024-50612",
  "CVE-2024-50613",
  "CVE-2025-52194",
  "CVE-2025-56226",
  "CVE-2026-37555",
]
until = "2027-01-18"
comment = "CVE-2024-50612 not applicable: The bug is in the Ogg/Vorbis write path (vorbis_analysis_wrote) and requires an application that encodes Vorbis with libsndfile. Among the libraries loaded by services, only libpulsecommon/libpulsecore link libsndfile; no service writes audio via libsndfile. | CVE-2024-50613 not applicable: Reachable assertion in the MP3 encoder (mpeg_l3_encoder_close), only when writing MP3 via libsndfile. No service encodes audio with libsndfile; in the service context only libpulsecommon links the library. | CVE-2025-52194 not applicable: Overflow when reading IRCAM headers via sf_open. In the services (Immich, mautrix bridges) ffmpeg parses audio with its own demuxers, libsndfile is only pulled in via libpulsecommon (sndfile-util for paplay/samples). | CVE-2025-56226 not applicable: Memory leak in mpeg_l3_encoder_init, only in the MP3 write path. No service encodes via libsndfile. | CVE-2026-37555 not applicable: Integer overflow in the IMA ADPCM WAV read path, unpatched in 1.2.2. It requires sf_open on an attacker-supplied WAV. In the service context only libpulsecommon/libpulsecore link libsndfile; ffmpeg (Immich, mautrix) decodes WAV itself, and no Pulse/PipeWire daemon is running."

["libsoup-3.6.6"]
cve = [
  "CVE-2026-102555",
  "CVE-2026-102556",
  "CVE-2026-102557",
  "CVE-2026-102558",
  "CVE-2026-102559",
  "CVE-2026-102560",
]
until = "2027-01-18"
comment = "CVE-2026-102559 and CVE-2026-102560 not applicable: Heap overflow when sending very large WebSocket frames (client masking or permessage-deflate, respectively), unpatched in 3.6.6. Referrers of libsoup on both hosts are still only gssdp, gupnp, NetworkManager-openconnect, tinysparql and webkitgtk, no service uses libsoup WebSockets. | CVE-2026-102555 not applicable: Unpatched (fix e4f03226 only in 3.7.3, not among the nixpkgs patches). However, on both hosts libsoup is only referenced by desktop libraries (webkitgtk, tinysparql via gtk3, gupnp/gssdp via libnice in gst-plugins-bad, NM-openconnect GUI). No service decodes data: URIs with it. | CVE-2026-102556 not applicable: Unpatched (fix d2cbaf25 in 3.7.3). Only affects applications that use SoupWebsocketConnection with a ::pong handler. On the hosts libsoup is only referenced by GUI libraries, no service builds libsoup WebSockets. | CVE-2026-102557 not applicable: Unpatched (fix d7f074f8 in 3.7.3). The WebSocket fragment reassembly bug requires a libsoup WebSocket client or server. No service on edge/portuus uses libsoup WebSockets, referrers are only GUI libraries. | CVE-2026-102558 not applicable: Unpatched (fix 381a474f in 3.7.3). Affects SoupWebsocketConnection with unlimited max-incoming-payload-size. No service on the hosts uses libsoup WebSockets, referrers are only GUI libraries."

["libusb-1.0.29"]
cve = [
  "CVE-2026-23679",
  "CVE-2026-47104",
]
until = "2027-01-18"
comment = "CVE-2026-23679 not applicable: The bug can only be triggered with crafted USB descriptors, i.e. via a physically attached device (portuus) or via control of the hypervisor (edge VPS). The consequence is only a NULL-deref crash of the calling process. No service on the hosts enumerates USB devices via libusb. | CVE-2026-47104 not applicable: This is a 1-byte out-of-bounds read when parsing IAD descriptors. It requires crafted USB devices, i.e. physical access or hypervisor control. On the hosts no service processes USB descriptors via libusb."

["nghttp2-1.69.0"]
cve = [
  "CVE-2026-58055",
]
until = "2027-01-18"
comment = "CVE-2026-58055 not applicable: The flaw is only in the proxy program nghttpx, not in libnghttp2. nghttpx is not run as a service on any host. edge uses nginx as its proxy, and there only nghttp2-lib is in the closure (for curl, bind, libsoup). On portuus the binary package is only in the closure as a dependency of nghttp2-dev."

["nmap-7.99"]
cve = [
  "CVE-2026-58058",
]
until = "2027-01-18"
comment = "CVE-2026-58058 not applicable: The version is affected and not patched in nixpkgs. However, the bug can only be triggered when an admin manually starts an IPv6 raw scan against a malicious target. The consequence is a crash or out-of-bounds read in the admin's own scanner process; no service or timer calls nmap."

["olm-3.2.16"]
