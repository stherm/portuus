comment = "CVE-2026-18295 not applicable: The affected element is qtmoovrecover in gst-plugins-good (< 1.28.5). The core package gstreamer-1.26.11 only contains coreelements/coretracers, and gst-plugins-good is in neither of the two system closures. | CVE-2026-18296 not applicable: Same advisory as CVE-2026-18295 (qtmoovrecover/MRF in gst-plugins-good < 1.28.5). The core package does not contain the code, and gst-plugins-good is not installed on any host. | CVE-2026-18297 not applicable: The Opus decoder belongs to gst-plugins-base (< 1.28.5), not the core package. gst-plugins-base-1.26.11 only comes in via GUI libraries (gtk4, webkitgtk, pipewire, libcamera) of the NM VPN editor plugins and kitty; no systemd service depends on it. Immich ML uses the fixed gst-plugins-base-1.28.7. | CVE-2026-18298 not applicable: The affected element is gdkpixbufdec in gst-plugins-good (< 1.28.5). The core package does not contain it, and gst-plugins-good is not in the closure on any host. | CVE-2026-18299 not applicable: The affected element is rtpsbcdepay in gst-plugins-good (< 1.28.5). The core package does not contain it, and gst-plugins-good is not in the closure on any host. | CVE-2026-2920 not applicable: The ASF demuxer belongs to gst-plugins-ugly. The original fix is included in 1.26.11 ('asfdemux: Error out on files with more than 32 streams'). A follow-up fix (SA-2026-0058) affects ugly < 1.28.5, but gst-plugins-ugly is not installed on any host, and the core package does not contain the demuxer. | CVE-2026-73433 not applicable: The affected element is avidemux in gst-plugins-good (< 1.28.6). The core package does not contain avidemux, and gst-plugins-good is not in the closure on any host. | CVE-2026-73434 not applicable: Same advisory as CVE-2026-73433 (avidemux vprp in gst-plugins-good < 1.28.6). The code is not in the core package, and gst-plugins-good is not installed on any host."

["imagemagick-7.1.2-31"]
