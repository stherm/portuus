comment = "CVE-2025-46394 not applicable: The affected busybox is the nix sandbox shell (make allnoconfig, only CONFIG_ASH). It contains only the binaries ash, busybox and sh; the tar applet is not built."

["cjson-1.7.19"]
cve = [
  "CVE-2026-16554",
  "CVE-2026-67215",
  "CVE-2026-67216",
  "CVE-2026-67217",
]
until = "2027-01-18"
comment = "CVE-2026-16554 not applicable: The overflow only occurs on 32-bit platforms and only with cJSON_PrintBuffered(). Both hosts are x86_64. The only user in the runtime closure is librist, and librist does not call cJSON_PrintBuffered. | CVE-2026-67215 not applicable: The flaw is only exploitable via JSON Patch (cJSONUtils_ApplyPatches*) from libcjson_utils. The only user of cjson on the hosts is librist. librist only generates statistics JSON and imports neither cJSONUtils functions nor any parse function. | CVE-2026-67216 not applicable: Only cJSON_Compare() on attacker-influenced input is affected. librist is the only user of cjson in the closure and does not call cJSON_Compare. librist also does not parse any JSON. | CVE-2026-67217 not applicable: Only apply_patch() in cJSON_Utils (JSON Patch) is affected. It is not used by any program on the hosts. librist, the only user, does not link libcjson_utils and does not call any cJSONUtils functions."

["dhcpcd-10.3.1"]
cve = [
  "CVE-2026-56113",
  "CVE-2026-56114",
  "CVE-2026-56116",
  "CVE-2026-56117",
]
until = "2027-01-18"
comment = "CVE-2026-56113 not applicable: DHCPv6 use-after-free in the dhcpcd daemon. dhcpcd runs on no host: no systemd service dhcpcd, NetworkManager uses the internal DHCP client (dhcp=internal). dhcpcd is only in the closure as an optional runtime dependency of NetworkManager and is never started. | CVE-2026-56114 not applicable: Stack OOB write in dhcp6_makemessage of the dhcpcd daemon. The daemon runs on no host: NetworkManager with dhcp=internal, no dhcpcd service. | CVE-2026-56116 not applicable: Memory leak when processing IPv6 router advertisements in the dhcpcd daemon. dhcpcd runs on no host, RAs are processed by the kernel/NetworkManager (dhcp=internal). | CVE-2026-56117 not applicable: Use-after-free in the control socket of the running dhcpcd daemon (only without privsep). Since dhcpcd is not started on any host, there is no control socket; in addition, only admins have local logins."

["fzf-0.72.0"]
cve = [
  "CVE-2026-53432",
  "CVE-2026-53433",
]
until = "2027-01-18"
comment = "CVE-2026-53432 not applicable: The version is affected (fix only in 0.73.1). However, fzf is only used interactively by admins: system-path and the synix tailnet switch script with fixed, short input. A crash needs a line of about 2.2 MB plus a 999-byte pattern typed by the admin, and would only panic their own process; no service uses fzf. | CVE-2026-53433 not applicable: Only the HTTP server in --listen mode is affected. Neither the repo nor synix starts fzf with --listen. fzf only runs interactively (tailnet switch script, admin shell)."

